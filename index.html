<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL CÓDICE DE ENTRENAMIENTO - PLATAFORMA DINÁMICA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #070507;
            --bg-card: #120d12;
            --bg-input: #1a121a;
            
            --wine-red: #800020;
            --wine-red-bright: #a3082a;
            
            --border-color: #241724;
            --border-wine: rgba(163, 8, 42, 0.4);
            
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            --badge-fuerza: #ff7b00;
            --badge-hipertrofia: #00d2ff;
            --badge-movilidad: #10b981;
            --badge-rehabilitación: #a855f7;
            --badge-potencia: #f59e0b;
            --badge-cardio: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 80px;
        }

        header {
            text-align: center;
            padding: 24px 12px;
            background: radial-gradient(circle at top, rgba(163, 8, 42, 0.25) 0%, rgba(7, 5, 7, 0) 75%);
            border: 1px solid var(--border-color);
            border-bottom: 2px solid var(--wine-red-bright);
            border-radius: 12px;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        header h1 span {
            color: var(--wine-red-bright);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 24px 0 12px 0;
        }

        .section-header h2 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .section-header .dot {
            width: 8px;
            height: 8px;
            background-color: var(--wine-red-bright);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--wine-red-bright);
        }

        /* SPLIT SEMANAL */
        .weekly-split {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .day-column {
            flex: 0 0 280px;
            scroll-snap-align: start;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 1024px) {
            .weekly-split {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                overflow-x: visible;
            }
            .day-column {
                flex: none;
                width: 100%;
            }
        }

        .day-column h3 {
            color: var(--wine-red-bright);
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            padding-bottom: 6px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .drop-zone {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .split-card {
            background: var(--bg-body);
            border: 1px solid var(--border-wine);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .split-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .split-card-title {
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.2;
            padding-right: 15px;
        }

        .split-card-meta {
            font-size: 0.65rem;
            color: var(--badge-hipertrofia);
            font-weight: 700;
        }

        .btn-remove {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 1.1rem;
            cursor: pointer;
            position: absolute;
            top: 4px;
            right: 6px;
        }

        /* FORMATO POST-IT */
        .postit-note {
            background: #fef08a;
            color: #1e1b4b;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 2px 2px 2px 10px;
            box-shadow: 2px 3px 6px rgba(0,0,0,0.4);
            border-left: 3px solid #eab308;
            margin-top: 4px;
            position: relative;
            word-break: break-word;
            transform: rotate(-1deg);
        }

        .postit-note::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            border-width: 8px 8px 0 0;
            border-style: solid;
            border-color: #ca8a04 #120d12;
            display: block;
            width: 0;
        }

        .btn-add-note {
            background: transparent;
            border: none;
            color: #fde047;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            padding: 2px 0 0 0;
        }

        /* CONTROLES Y FILTROS */
        .controls-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-group {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-btn {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: var(--wine-red-bright);
            color: #fff;
            border-color: var(--wine-red-bright);
        }

        .btn-add {
            background: var(--wine-red-bright);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        /* TARJETAS DE EJERCICIOS */
        .muscle-group-title {
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 700;
            margin: 20px 0 10px 0;
            padding-left: 8px;
            border-left: 3px solid var(--wine-red-bright);
            text-transform: uppercase;
        }

        .exercise-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 145px;
            position: relative;
        }

        .card-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-right: 24px;
        }

        .badge {
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px;
            line-height: 1;
        }

        .card-title {
            color: var(--text-main);
            font-size: 0.8rem;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.7em;
        }

        .video-link {
            display: inline-block;
            margin-bottom: 8px;
            color: var(--badge-hipertrofia);
            font-size: 0.7rem;
            text-decoration: none;
            font-weight: 600;
        }

        .card-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: var(--bg-input);
            padding: 6px 8px;
            border-radius: 6px;
        }

        .input-box label {
            font-size: 0.58rem;
            color: var(--text-muted);
            text-transform: uppercase;
            display: block;
        }

        .input-box input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 700;
            outline: none;
            width: 100%;
        }

        /* MODALES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--wine-red-bright);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .day-option-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            text-align: left;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-delete-ex {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-cancel-modal {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>CÓDICE DE <span>ENTRENAMIENTO</span></h1>
        <p>Plataforma Dinámica de Fuerza, Rendimiento, Halterofilia & Rehabilitación</p>
    </header>

    <div class="section-header">
        <div class="dot"></div>
        <h2>01. Planificación Semanal</h2>
    </div>

    <div class="weekly-split">
        <div class="day-column"><h3>LUNES</h3><div class="drop-zone" id="lunes"></div></div>
        <div class="day-column"><h3>MARTES</h3><div class="drop-zone" id="martes"></div></div>
        <div class="day-column"><h3>MIÉRCOLES</h3><div class="drop-zone" id="miercoles"></div></div>
        <div class="day-column"><h3>JUEVES</h3><div class="drop-zone" id="jueves"></div></div>
        <div class="day-column"><h3>VIERNES</h3><div class="drop-zone" id="viernes"></div></div>
        <div class="day-column"><h3>SÁBADO</h3><div class="drop-zone" id="sabado"></div></div>
        <div class="day-column"><h3>DOMINGO</h3><div class="drop-zone" id="domingo"></div></div>
    </div>

    <div class="section-header">
        <div class="dot"></div>
        <h2>02. Biblioteca de Ejercicios</h2>
    </div>

    <div class="controls-panel">
        <div class="filter-group">
            <button class="filter-btn active" onclick="filterCat('all')">Todos</button>
            <button class="filter-btn" onclick="filterCat('Hipertrofia')">Hipertrofia</button>
            <button class="filter-btn" onclick="filterCat('Fuerza')">Fuerza</button>
            <button class="filter-btn" onclick="filterCat('Potencia')">Halterofilia</button>
            <button class="filter-btn" onclick="filterCat('Movilidad')">Movilidad</button>
            <button class="filter-btn" onclick="filterCat('Rehabilitación')">Rehabilitación</button>
            <button class="filter-btn" onclick="filterCat('Cardio')">Acondicionamiento</button>
        </div>
        <button class="btn-add" onclick="openCreateModal()">+ Crear Nuevo Ejercicio</button>
    </div>

    <div id="catalogContainer"></div>

    <div class="modal-overlay" id="menuModal">
        <div class="modal-card">
            <div class="modal-title" id="modalExTitle">Opciones de Ejercicio</div>
            <button class="day-option-btn" onclick="addSelectedToDay('lunes')">📅 Añadir a Lunes</button>
            <button class="day-option-btn" onclick="addSelectedToDay('martes')">📅 Añadir a Martes</button>
            <button class="day-option-btn" onclick="addSelectedToDay('miercoles')">📅 Añadir a Miércoles</button>
            <button class="day-option-btn" onclick="addSelectedToDay('jueves')">📅 Añadir a Jueves</button>
            <button class="day-option-btn" onclick="addSelectedToDay('viernes')">📅 Añadir a Viernes</button>
            <button class="day-option-btn" onclick="addSelectedToDay('sabado')">📅 Añadir a Sábado</button>
            <button class="day-option-btn" onclick="addSelectedToDay('domingo')">📅 Añadir a Domingo</button>
            
            <button class="btn-delete-ex" onclick="deleteExerciseFromCatalog()">🗑️ Eliminar del Catálogo</button>
            <button class="btn-cancel-modal" onclick="closeMenuModal()">Cancelar</button>
        </div>
    </div>

    <div class="modal-overlay" id="createModal">
        <div class="modal-card">
            <div class="modal-title">Crear Nuevo Ejercicio</div>
            <div class="form-group">
                <label>Nombre del Ejercicio (con traducción si aplica)</label>
                <input type="text" id="newTitle" placeholder="Ej. Snatch Balance con pausa">
            </div>
            
            <div class="form-group">
                <label>Grupo Muscular / Sección Destino</label>
                <select id="newGroupSelect" onchange="toggleCustomGroupInput(this.value)">
                    </select>
            </div>

            <div class="form-group" id="customGroupContainer" style="display: none;">
                <label>Nombre del Nuevo Grupo Muscular</label>
                <input type="text" id="newCustomGroup" placeholder="Ej. Antebrazos & Agarre">
            </div>

            <div class="form-group">
                <label>Categoría</label>
                <select id="new
